name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python source
        run: python -m compileall -q app tests repair453

      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find app repair453/patch -type f -name '*.js' ! -path '*/vendor/*' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "oneclick/bootstrap.ps1",
            "repair453/Install-Madar453-Books-Delete.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            $fullPath = Join-Path $PWD $file
            [System.Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
