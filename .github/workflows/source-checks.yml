name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python source
        run: python -m compileall -q app tests repair453 repair454 repair455

      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find app repair453/patch repair454/patch -type f -name '*.js' ! -path '*/vendor/*' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "oneclick/bootstrap.ps1",
            "oneclick/bootstrap455.ps1",
            "repair453/Install-Madar453-Books-Delete.ps1",
            "repair454/Install-Madar454-Storage-Root.ps1",
            "repair455/Install-Madar455-SIWC-Refresh.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            $fullPath = Join-Path $PWD $file
            [System.Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Install MinGW-w64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build v4.54 Windows x64 one-click installer
        if: github.ref != 'refs/heads/codex/v4.55-siwc-refresh-diagnostics'
        run: python oneclick/build_oneclick.py

      - name: Build v4.55 Windows x64 one-click installer
        if: github.ref == 'refs/heads/codex/v4.55-siwc-refresh-diagnostics'
        run: python oneclick/build_v455_oneclick.py

      - name: Upload v4.54 one-click installer artifact
        if: github.ref != 'refs/heads/codex/v4.55-siwc-refresh-diagnostics'
        uses: actions/upload-artifact@v4
        with:
          name: Madar454-OneClick-D
          path: dist/Madar454-OneClick-D.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload v4.55 one-click installer artifact
        if: github.ref == 'refs/heads/codex/v4.55-siwc-refresh-diagnostics'
        uses: actions/upload-artifact@v4
        with:
          name: Madar455-OneClick-D
          path: dist/Madar455-OneClick-D.exe
          if-no-files-found: error
          retention-days: 30
