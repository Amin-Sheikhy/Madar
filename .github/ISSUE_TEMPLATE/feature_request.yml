name: Feature request
description: Suggest an improvement to Madar.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or learning need
      description: Explain the need without including private learner records.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the feature and how it should work.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Expected benefit
      description: Who benefits and what improves?
    validations:
      required: true
