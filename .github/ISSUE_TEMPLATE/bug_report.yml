name: Bug report
description: Report a reproducible Madar issue (please omit private learner data).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach PDFs, learner records, databases, tokens, or private logs.
        Sanitize all screenshots and diagnostic output.
  - type: input
    id: version
    attributes:
      label: Madar version
      description: Exact full version string shown by the app.
      placeholder: "v4.53 ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, Python/runtime details if known, and relevant setup.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal ordered steps without private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: sanitized_evidence
    attributes:
      label: Sanitized evidence (optional)
      description: Redact account details, paths identifying you, tokens, and learner data.
